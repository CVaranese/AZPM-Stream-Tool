<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AZPM Singles Layout</title>
    <script src="Resources/AZPM/Scripts/Layout.mjs" type="module"></script>
    <link rel="stylesheet" href="Resources/AZPM/CSS/Game Layouts.css">
</head>

<body class="singles">

    <img class="absol" src="Resources/AZPM/Overlay/Game Layouts/Singles.png" alt="">

    <!-- top bar -->
    <span id="tournament" class="textBox topText" data-size="35"></span>
    <span id="bestOf" class="textBox topText" data-size="35" data-format="short"></span>
    <span id="round" class="textBox topText" data-size="35"></span>

    <!-- bottom bar: names in the team colour -->
    <span id="p1Wrapper" class="textBox wrappers">
        <span id="p1Tag" class="tag" data-size="32"></span><span id="p1Name" class="name" data-size="50"></span><span id="p1Pron" class="pronouns" data-size="24"></span>
    </span>
    <span id="p2Wrapper" class="textBox wrappers">
        <span id="p2Tag" class="tag" data-size="32"></span><span id="p2Name" class="name" data-size="50"></span><span id="p2Pron" class="pronouns" data-size="24"></span>
    </span>

    <!-- score ticks, first game first: filled with the team colour when the game is won -->
    <div id="p1Ticks" class="scores">
        <div class="scoreTick">
            <svg class="absol mirror scoreTickColor"><polygon points="6,5 37,6 150,100 114,100"/></svg>
            <img src="Resources/AZPM/Overlay/Game Layouts/Win Border.png" class="absol mirror" alt="">
        </div>
        <div class="scoreTick">
            <svg class="absol mirror scoreTickColor"><polygon points="6,5 37,6 150,100 114,100"/></svg>
            <img src="Resources/AZPM/Overlay/Game Layouts/Win Border.png" class="absol mirror" alt="">
        </div>
        <div class="scoreTick">
            <svg class="absol mirror scoreTickColor"><polygon points="6,5 37,6 150,100 114,100"/></svg>
            <img src="Resources/AZPM/Overlay/Game Layouts/Win Border.png" class="absol mirror" alt="">
        </div>
    </div>
    <div id="p2Ticks" class="scores">
        <div class="scoreTick">
            <svg class="absol"><polygon points="6,5 37,6 150,100 114,100"/></svg>
            <img src="Resources/AZPM/Overlay/Game Layouts/Win Border.png" class="absol" alt="">
        </div>
        <div class="scoreTick">
            <svg class="absol"><polygon points="6,5 37,6 150,100 114,100"/></svg>
            <img src="Resources/AZPM/Overlay/Game Layouts/Win Border.png" class="absol" alt="">
        </div>
        <div class="scoreTick">
            <svg class="absol"><polygon points="6,5 37,6 150,100 114,100"/></svg>
            <img src="Resources/AZPM/Overlay/Game Layouts/Win Border.png" class="absol" alt="">
        </div>
    </div>

    <!-- right panel: casters -->
    <div id="caster1" class="caster">
        <span class="casterNameBox">
            <span class="icon micIcon"></span>
            <span id="caster1Name" class="casterName" data-size="24"></span>
        </span>
        <span id="caster1Social" class="casterSocial">
            <span class="icon"></span>
            <span class="socialText" data-size="20"></span>
        </span>
    </div>
    <div id="caster2" class="caster">
        <span class="casterNameBox">
            <span class="icon micIcon"></span>
            <span id="caster2Name" class="casterName" data-size="24"></span>
        </span>
        <span id="caster2Social" class="casterSocial">
            <span class="icon"></span>
            <span class="socialText" data-size="20"></span>
        </span>
    </div>

    <div id="connErrorDiv">
        Can't connect with GUI, attempting to reconnect every 5 seconds...
    </div>

</body>
</html>
