<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AZPM Commentary Layout</title>
    <script src="Resources/AZPM/Scripts/Layout.mjs" type="module"></script>
    <link rel="stylesheet" href="Resources/AZPM/CSS/Game Layouts.css">
</head>

<body class="commentary">

    <img class="absol" src="Resources/AZPM/Overlay/Game Layouts/Commentary.png" alt="">

    <div id="caster1" class="caster">
        <span class="casterNameBox">
            <span class="icon micIcon"></span>
            <span id="caster1Name" class="casterName" data-size="52"></span>
        </span>
        <span id="caster1Social" class="casterSocial">
            <span class="icon"></span>
            <span class="socialText" data-size="30"></span>
        </span>
    </div>
    <div id="caster2" class="caster">
        <span class="casterNameBox">
            <span class="icon micIcon"></span>
            <span id="caster2Name" class="casterName" data-size="52"></span>
        </span>
        <span id="caster2Social" class="casterSocial">
            <span class="icon"></span>
            <span class="socialText" data-size="30"></span>
        </span>
    </div>

    <div id="connErrorDiv">
        Can't connect with GUI, attempting to reconnect every 5 seconds...
    </div>

</body>
</html>
